<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel VJ - Bradesco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'BradescoSans';
            src: url('fonte - BradescoSans-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        body {
            font-family: 'BradescoSans', sans-serif;
            background-color: #000;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }
        .text-custom {
            font-weight: 500 !important;
        }
        /* Animação Slide-up Sequencial Blindada em Linha Reta */
        .slide-up-item {
            opacity: 0;
            /* O segredo: o translateX horizontal já fica fixo na base para o elemento subir reto */
            transform: translateY(70px) translateX(var(--tx-nudge, 0px)) scaleX(var(--sx, 1)) scaleY(var(--sy, 1));
            transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.75s ease;
        }
        .slide-up-item.active {
            opacity: var(--op, 1);
            transform: translateY(0) translateX(var(--tx-nudge, 0px)) scaleX(var(--sx, 1)) scaleY(var(--sy, 1));
        }
        video::-webkit-media-controls {
            display: none !important;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative bg-[#CC092F]">

    <!-- TELA DE LOGIN PRIVADA (LAYER DE PROTEÇÃO) -->
    <div id="gatekeeper" class="fixed inset-0 bg-zinc-950 flex flex-col items-center justify-center z-[100] transition-opacity duration-500 opacity-100">
        <div class="w-80 p-6 bg-zinc-900 rounded-2xl border border-zinc-800 text-center shadow-2xl">
            <div class="w-3 h-3 rounded-full bg-rose-600 mx-auto mb-3 animate-pulse"></div>
            <h2 class="text-white font-bold tracking-wide uppercase text-sm mb-1">Acesso Restrito</h2>
            <p class="text-xs text-zinc-500 mb-5">Painel VJ • Banco Bradesco S.A.</p>
            <input type="password" id="inputSenha" placeholder="Digite a senha do painel" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-center text-white font-mono text-sm focus:outline-none focus:border-rose-600 mb-3 transition-colors">
            <button id="btnEntrar" class="w-full bg-rose-600 hover:bg-rose-700 active:scale-[0.98] transition-all text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider">Desbloquear Sinal</button>
            <p id="erroSenha" class="text-rose-500 text-[11px] mt-2 hidden">Senha incorreta. Verifique com a produção.</p>
        </div>
    </div>

    <!-- CONTEÚDO DO APP BLOQUEADO (REVELADO APÓS SENHA) -->
    <div id="appContent" class="absolute inset-0 w-full h-full hidden opacity-0 transition-opacity duration-700">
        
        <!-- CONTAINER DO VÍDEO INSTITUCIONAL (EM ESTILO CONTAIN FIXO EM 58%) -->
        <div id="videoContainer" class="absolute inset-0 w-full h-full z-10 transition-opacity duration-500 opacity-100 flex items-center justify-center bg-[#CC092F]">
            <video id="instVideo" class="w-full h-full object-fill transition-transform duration-300" style="transform: scaleX(1.2) scaleY(1.2); transform-origin: center;" muted playsinline preload="auto">
                <source src="bradesco_video_01.mp4" type="video/mp4">
            </video>
        </div>

        <!-- CONTAINER DO RELÓGIO DIGITAL INLINE (ATRAZ DO VÍDEO COM FUNDO INTEGRADO) -->
        <div id="ledDisplay" class="absolute inset-0 w-full h-full flex items-center justify-center z-0 bg-[#CC092F]">
            <div id="grupoGeral" class="grid grid-cols-[1fr_auto_1fr] items-center justify-center w-full max-w-[90%] mx-auto text-white text-center transition-all duration-300" style="transform: scale(1.25); opacity: 1;">
                
                <!-- Coluna Esquerda: Data (Sobe reto em trilho isolado) -->
                <div class="flex justify-end items-center pr-4">
                    <div id="itemData" class="slide-up-item text-custom text-[8vw] whitespace-nowrap" style="--sx: 0.8; --sy: 0.8; --op: 1; --tx-nudge: -57px;">
                        <span id="txtData">03/07</span>
                    </div>
                </div>

                <!-- Coluna Central: Hora + Divisores Fixos (Sobem retos) -->
                <div class="flex items-center justify-center gap-6">
                    <span id="itemDiv1" class="slide-up-item text-[6vw] font-light text-custom" style="--sx: 0.25; --sy: 0.57; --op: 1; --tx-nudge: -45px;">|</span>
                    <div id="itemHora" class="slide-up-item text-custom text-[11vw] tracking-tight whitespace-nowrap" style="--sx: 1.3; --sy: 1.3; --op: 1; --tx-nudge: 0px;">
                        <span id="txtHora">10:09</span>
                    </div>
                    <span id="itemDiv2" class="slide-up-item text-[6vw] font-light text-custom" style="--sx: 0.25; --sy: 0.57; --op: 1; --tx-nudge: 45px;">|</span>
                </div>

                <!-- Coluna Direita: Clima (Sobe reto) -->
                <div class="flex justify-start items-center pl-4">
                    <div id="itemClima" class="slide-up-item text-custom text-[8vw] flex items-center whitespace-nowrap" style="--sx: 0.8; --sy: 0.8; --op: 1; --tx-nudge: 57px;">
                        <span id="txtTemp">21</span><span class="inline-block align-super text-[0.92em] -ml-1">°C</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- BARRA OPERACIONAL SUTIL DO RODAPÉ (RESET VJ + CONFIGS SECRETA) -->
        <div id="footerControls" class="absolute bottom-4 left-4 z-50 flex items-center gap-3 hidden">
            <button id="btnResetVJ" class="bg-black/40 hover:bg-black/60 active:scale-95 transition-all text-[11px] text-zinc-300 hover:text-white px-3 py-1.5 rounded-lg border border-zinc-800/80 uppercase font-bold tracking-wider">
                Reset Transmissão
            </button>
            <div id="countdownDisplay" class="bg-rose-950/80 border border-rose-800/50 px-2.5 py-1.5 rounded-lg text-rose-400 font-mono font-bold text-[11px] uppercase hidden">
                Sinal em: <span id="countdownSeconds">5s</span>
            </div>
            <!-- Ícone de Engrenagem Discreta para abrir Configurações -->
            <button id="openPanelBtn" class="text-zinc-600 hover:text-zinc-400 transition-colors p-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>

        <!-- PAINEL DE CALIBRAÇÃO LATERAL (ABRE COM "H" OU CLIQUE NA ENGRENAGEM) -->
        <div id="panelVJ" class="fixed right-0 top-0 h-full w-96 bg-zinc-950/95 text-zinc-200 p-6 shadow-2xl overflow-y-auto transform translate-x-full transition-transform duration-300 z-50 border-l border-zinc-800 text-sm">
            <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                <div>
                    <h2 class="font-bold text-base tracking-wide text-white uppercase">Calibração de Sinal</h2>
                    <p class="text-xs text-zinc-500">PROJETO OPERACIONAL - OSASCO</p>
                </div>
                <button id="closePanel" class="text-zinc-400 hover:text-white text-xl">&times;</button>
            </div>

            <!-- TIMING DO LOOP -->
            <div class="bg-zinc-900/50 p-4 rounded-xl mb-6 border border-zinc-800/60">
                <h3 class="font-semibold text-zinc-300 mb-3 flex items-center gap-2">⏱️ Configuração do Loop</h3>
                <div>
                    <label class="flex justify-between text-xs text-zinc-400 mb-1">
                        <span>Tempo do Relógio na Tela (segundos)</span>
                        <span id="valTempoTela" class="font-mono text-rose-500 font-bold">15s</span>
                    </label>
                    <input type="range" id="tempoTela" min="5" max="60" value="15" class="w-full accent-rose-600 bg-zinc-800 h-1 rounded">
                </div>
            </div>
            <p class="text-center text-[11px] text-zinc-600 mt-8">Pressione <kbd class="bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-400 font-mono">H</kbd> para abrir/fechar o menu.</p>
        </div>
    </div>

    <script>
        // Configuração de Segurança - Altere aqui para a senha desejada
        const SENHA_CORRETA = 'bradesco123';

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } },
            setItem: (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} }
        };

        const gatekeeper = document.getElementById('gatekeeper');
        const appContent = document.getElementById('appContent');
        const inputSenha = document.getElementById('inputSenha');
        const btnEntrar = document.getElementById('btnEntrar');
        const erroSenha = document.getElementById('erroSenha');

        function checarAcesso() {
            if (safeStorage.getItem('vj_autenticado') === 'true') {
                liberarPainel();
            }
        }

        function validarSenha() {
            if (inputSenha.value === SENHA_CORRETA) {
                safeStorage.setItem('vj_autenticado', 'true');
                liberarPainel();
            } else {
                erroSenha.classList.remove('hidden');
                inputSenha.value = '';
                inputSenha.focus();
            }
        }

        function liberarPainel() {
            gatekeeper.classList.remove('opacity-100');
            gatekeeper.classList.add('opacity-0');
            setTimeout(() => {
                gatekeeper.style.display = 'none';
                appContent.classList.remove('hidden');
                setTimeout(() => {
                    appContent.classList.remove('opacity-0');
                    appContent.classList.add('opacity-100');
                    
                    document.body.style.setProperty('--font-weight', 500);
                    IniciarCicloTransmissao();
                }, 50);
            }, 500);
        }

        btnEntrar.onclick = validarSenha;
        inputSenha.onkeydown = (e) => { if (e.key === 'Enter') validarSenha(); };

        // Estados Operacionais da Transmissão do Estúdio
        let state = {
            tempoTela: parseInt(safeStorage.getItem('vj_tempoTela')) || 15,
            fontWeight: 500
        };

        const videoContainer = document.getElementById('videoContainer');
        const ledDisplay = document.getElementById('ledDisplay');
        const instVideo = document.getElementById('instVideo');
        const panelVJ = document.getElementById('panelVJ');
        const footerControls = document.getElementById('footerControls');
        const btnResetVJ = document.getElementById('btnResetVJ');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const countdownSeconds = document.getElementById('countdownSeconds');

        // Sequência sincronizada de delays da Cascata
        const animItems = [
            { id: 'itemData', delay: 100 },
            { id: 'itemDiv1', delay: 300 },
            { id: 'itemHora', delay: 450 },
            { id: 'itemDiv2', delay: 600 },
            { id: 'itemClima', delay: 750 }
        ];

        let transmissionTimeout = null;
        let countdownInterval = null;

        function IniciarCicloTransmissao() {
            clearTimeout(transmissionTimeout);
            ledDisplay.classList.remove('opacity-100');
            ledDisplay.classList.add('opacity-0');
            
            animItems.forEach(item => {
                document.getElementById(item.id).classList.remove('active');
            });

            setTimeout(() => {
                videoContainer.classList.remove('opacity-0');
                videoContainer.classList.add('opacity-100');
                instVideo.currentTime = 0;
                instVideo.play().catch(e => console.log("Aguardando interação inicial."));
            }, 500);
        }

        instVideo.onended = () => {
            videoContainer.classList.remove('opacity-100');
            videoContainer.classList.add('opacity-0');

            setTimeout(() => {
                ledDisplay.classList.remove('opacity-0');
                ledDisplay.classList.add('opacity-100');

                animItems.forEach(item => {
                    setTimeout(() => {
                        document.getElementById(item.id).classList.add('active');
                    }, item.delay);
                });

                transmissionTimeout = setTimeout(() => {
                    IniciarCicloTransmissao();
                }, state.tempoTela * 1000);

            }, 400); 
        };

        // Função de Reset e Contagem Regressiva de Sincronismo (VJ Show)
        btnResetVJ.onclick = () => {
            clearTimeout(transmissionTimeout);
            clearInterval(countdownInterval);
            
            instVideo.pause();
            videoContainer.classList.remove('opacity-100');
            videoContainer.classList.add('opacity-0');
            ledDisplay.classList.remove('opacity-100');
            ledDisplay.classList.add('opacity-0');
            animItems.forEach(item => document.getElementById(item.id).classList.remove('active'));

            let timeLeft = 5;
            countdownSeconds.textContent = timeLeft + 's';
            countdownDisplay.classList.remove('hidden');

            countdownInterval = setInterval(() => {
                timeLeft--;
                countdownSeconds.textContent = timeLeft + 's';
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdownDisplay.classList.add('hidden');
                    IniciarCicloTransmissao();
                }
            }, 1000);
        };

        function updateClock() {
            const agora = new Date();
            document.getElementById('txtHora').textContent = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('txtData').textContent = agora.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
        }

        async function fetchWeatherOsasco() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-23.5325&longitude=-46.7917&current_weather=true');
                const data = await res.json();
                if (data && data.current_weather) {
                    document.getElementById('txtTemp').textContent = Math.round(data.current_weather.temperature);
                }
            } catch (e) {
                console.log("Erro ao buscar clima de Osasco.");
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h') {
                panelVJ.classList.toggle('translate-x-full');
                footerControls.classList.toggle('hidden');
            }
        });
        document.getElementById('closePanel').onclick = () => {
            panelVJ.classList.add('translate-x-full');
            footerControls.classList.add('hidden');
        };
        document.getElementById('openPanelBtn').onclick = () => {
            panelVJ.classList.remove('translate-x-full');
            footerControls.classList.remove('hidden');
        };

        const sliderTempo = document.getElementById('tempoTela');
        const valTempoText = document.getElementById('valTempoTela');
        
        sliderTempo.oninput = (e) => {
            state.tempoTela = parseInt(e.target.value);
            valTempoText.textContent = state.tempoTela + 's';
            safeStorage.setItem('vj_tempoTela', state.tempoTela);
        };

        sliderTempo.value = state.tempoTela;
        valTempoText.textContent = state.tempoTela + 's';
        
        setInterval(updateClock, 1000);
        setInterval(fetchWeatherOsasco, 300000);
        updateClock();
        fetchWeatherOsasco();

        checarAcesso();
    </script>
</body>
</html>
